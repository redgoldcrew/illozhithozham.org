# Netlify has no PHP runtime at request time, so pages are rendered to static
# HTML at build time using the PHP CLI available in the build image.
[build]
  command = "bash build.sh"
  publish = "dist"

# Old *.php URLs permanently redirect to the clean pre-rendered pages.
# (Netlify placeholders must match a whole path segment, so each page is listed.)
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301

[[redirects]]
  from = "/event.php"
  to = "/event"
  status = 301

[[redirects]]
  from = "/admins.php"
  to = "/admins"
  status = 301

[[redirects]]
  from = "/aboutus.php"
  to = "/aboutus"
  status = 301

[[redirects]]
  from = "/contactus.php"
  to = "/contactus"
  status = 301

[[redirects]]
  from = "/registration.php"
  to = "/registration"
  status = 301

[[redirects]]
  from = "/volunteer.php"
  to = "/volunteer"
  status = 301

[[redirects]]
  from = "/sponser.php"
  to = "/sponser"
  status = 301
